name: Test skill metadata

on:
  push:
    branches: [main]
    paths: ["**/SKILL.md", "scripts/check_skill_metadata.py", "tests/test_skill_metadata.py", ".github/workflows/test-skill-metadata.yml"]
  pull_request:
    paths: ["**/SKILL.md", "scripts/check_skill_metadata.py", "tests/test_skill_metadata.py", ".github/workflows/test-skill-metadata.yml"]

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
      - run: uv run --no-project --with pyyaml python scripts/check_skill_metadata.py
      - run: uv run --no-project --with pyyaml --with pytest pytest tests/test_skill_metadata.py -q
